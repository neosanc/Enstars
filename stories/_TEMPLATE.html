<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>STORY TITLE HERE - Enstars Archive</title>
  <link rel="stylesheet" href="../styles.css">
</head>
<body>
  <div class="story-container">
    
    <!-- ============ EDIT THIS HEADER ============ -->
    <div class="story-header">
      <h1>STORY TITLE HERE</h1>
      <p class="story-info">Story Type · Chapter Number</p>
    </div>

    <!-- ============================================
         QUICK REFERENCE - Character classes:
         
         midori, chiaki, kanata, tetora, shinobu,
         subaru, hokuto, makoto, mao, player, narrator
         
         (Add more in styles.css if needed!)
         ============================================ -->

    <!-- ====== DIALOGUE WITH SPRITE ====== -->
    <!-- Use when character first appears or changes expression -->
    <div class="dialogue CHARACTER">
      <img class="sprite" src="../sprites/CHARACTER.png" alt="Name">
      <div class="dialogue-content">
        <p class="name">NAME</p>
        <p class="text">Dialogue text here...</p>
      </div>
    </div>

    <!-- ====== DIALOGUE CONTINUATION (no sprite) ====== -->
    <!-- Use when same character continues talking -->
    <div class="dialogue CHARACTER no-sprite">
      <div class="dialogue-content">
        <p class="text">More dialogue from the same character...</p>
      </div>
    </div>

    <!-- ====== PLAYER CHOICE ====== -->
    <div class="player-choice">
      Player's choice text here.
    </div>

    <!-- ====== NAVIGATION ====== -->
    <div class="nav-links">
      <a href="../index.html">← Back to Index</a>
      <a href="NEXT-CHAPTER.html">Next Chapter →</a>
    </div>

  </div>
</body>
</html>
